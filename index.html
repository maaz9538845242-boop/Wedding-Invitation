    <!-- GSAP Animation Library -->

    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-primary: #2c2a29;
            --text-muted: #6b6764;
            --accent-gold: #c5a059;
            --accent-lavender: #d6d4e0;
            --border-color: #e3dec9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Cormorant Garamond', serif;
            overflow-x: hidden;
            position: relative;
            height: 100vh;
            height: 100dvh;
        }

        /* Subtle Paper Texture Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 0);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 999;
        }

        /* --- AUDIO TOGGLE --- */
        .audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        .audio-control.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .audio-control svg {
            width: 20px;
            height: 20px;
            fill: var(--text-primary);
        }

        /* --- ENVELOPE OVERLAY SCREEN --- */
        #envelope-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh;
            background: #f0ede6;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .envelope-card {
            width: 90%;
            max-width: 420px;
            height: 600px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .envelope-flap {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background: #eae5dc;
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            transform-origin: top;
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 3;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .wax-seal {
            width: 76px;
            height: 76px;
            background: radial-gradient(circle at 30% 30%, #e2dff0, #b8b3d1);
            border: 2px solid #9b95be;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15), inset 0 2px 4px rgba(255,255,255,0.6);
            z-index: 4;
            cursor: pointer;
            font-family: 'Pinyon Script', cursive;
            font-size: 26px;
            color: #3b3554;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: pulse-seal 2s infinite ease-in-out;
        }

        .wax-seal:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        @keyframes pulse-seal {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        .envelope-prompt {
            position: absolute;
            bottom: 60px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-muted);
            z-index: 4;
        }

        /* --- MAIN INVITATION CONTAINER --- */
        #main-content {
            opacity: 0;
            visibility: hidden;
            overflow-y: auto;
            height: 100vh;
            height: 100dvh;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .invitation-section {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            text-align: center;
            position: relative;
            background-color: var(--bg-color);
        }

            max-width: 440px;

            padding: 40px 28px;
            display: flex;
